<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada - GETA</title>
  <style>
    body { margin: 0; background: #eceff1; font-family: Helvetica, Arial, sans-serif; color: rgba(0,0,0,.87); }
    #message { background: #fff; max-width: 360px; margin: 100px auto 16px; padding: 32px 24px 24px; border-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.24); }
    h2 { color: #3241db; font-size: 16px; margin: 0 0 8px; }
    h1 { font-size: 22px; font-weight: 300; color: rgba(0,0,0,.6); margin: 0 0 16px; }
    p { line-height: 140%; font-size: 14px; margin: 0 0 24px; }
    a { display: block; text-align: center; background: #3241db; color: #fff; text-transform: uppercase; text-decoration: none; padding: 16px; border-radius: 4px; }
    @media (max-width: 600px) { body, #message { margin-top: 0; box-shadow: none; background: #fff; } body { border-top: 16px solid #3241db; } }
  </style>
</head>
<body>
  <div id="message">
    <h2>404</h2>
    <h1>Página não encontrada</h1>
    <p>O endereço que você acessou não existe ou foi movido. Confira a URL e tente novamente.</p>
    <a href="/">Voltar ao início</a>
  </div>
</body>
</html>
