<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - GETA</title>
  <link rel="icon" type="image/png" href="img/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="container" id="container">

    <!-- Cadastro -->
    <div class="form-container sign-up">
      <form id="registerForm" novalidate>
        <h1>Crie sua conta</h1>
        <div class="social-icons">
          <a href="#" class="icon" aria-label="Google"><i class="fa-brands fa-google-plus-g"></i></a>
          <a href="#" class="icon" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" class="icon" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
          <a href="#" class="icon" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
        <span>Faça seu registro com e-mail</span>
        <div class="form-control">
          <input type="text" id="reg-name" placeholder="Nome completo" autocomplete="name">
          <i class="icon"></i>
        </div>
        <div class="form-control">
          <input type="email" id="reg-email" placeholder="Email" autocomplete="email">
          <i class="icon"></i>
        </div>
        <div class="form-control">
          <input type="password" id="reg-password" placeholder="Senha" autocomplete="new-password">
          <i class="icon"></i>
        </div>
        <button type="submit" id="register-button" disabled>Registrar</button>
        <p class="msg" id="register-message"></p>
      </form>
    </div>

    <!-- Login -->
    <div class="form-container sign-in">
      <form id="mainForm" novalidate>
        <h1>Faça seu login</h1>
        <div class="social-icons">
          <a href="#" class="icon" aria-label="Google"><i class="fa-brands fa-google-plus-g"></i></a>
          <a href="#" class="icon" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" class="icon" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
          <a href="#" class="icon" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
        </div>
        <span>Sua conta</span>
        <div class="form-control">
          <input type="email" id="email" placeholder="Email" autocomplete="email">
          <i class="icon"></i>
        </div>
        <div class="form-control">
          <input type="password" id="password" placeholder="Senha" autocomplete="current-password">
          <i class="icon"></i>
        </div>
        <button type="button" id="forgotpassword" disabled>Recuperar senha</button>
        <button type="submit" id="login-button" disabled>Entrar</button>
        <p class="msg" id="login-message"></p>
      </form>
    </div>

    <!-- Painel deslizante -->
    <div class="toggle-container">
      <div class="toggle">
        <div class="toggle-panel toggle-left">
          <h1><img src="assets/logos/s_fundo.png" alt="GETA" width="100" height="100"><br>Bem-vindo!</h1>
          <p>Registre-se com seus dados e tenha acesso ao monitoramento</p>
          <button class="hidden" id="login">Entrar</button>
        </div>
        <div class="toggle-panel toggle-right">
          <h1><img src="assets/logos/s_fundo.png" alt="GETA" width="100" height="100"><br>Bem-vindo!</h1>
          <p>Digite seus dados e tenha acesso aos seus sensores!</p>
          <button class="hidden" id="register">Registrar</button>
        </div>
      </div>
    </div>
  </div>

  <a class="back-home" href="index.html"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</a>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
